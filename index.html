<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bunkr — Hostel life, without the chaos.</title>
<style>
:root{--bg:#F7F8FA;--card:#fff;--tx:#111827;--tx2:#6B7280;--bd:#E5E7EB;--nav:#0B1220;--ac:#FF6B35;--soft:#FFF1EB;--ok:#16A34A;--wa:#F59E0B;--er:#EF4444;--in:#2563EB;--in2:#EEF2F7}
:root[data-t=dark]{--bg:#0B1220;--card:#111827;--tx:#F3F4F6;--tx2:#9CA3AF;--bd:#1F2937;--nav:#070C16;--soft:#2A1A12;--in2:#1B2433}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{font:15px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{border:1px solid var(--bd);background:var(--card);padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600;transition:.15s}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}.sm{padding:5px 10px;font-size:13px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:9px;background:var(--card)}label{font-size:13px;font-weight:600;display:block;margin:12px 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px}.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
h1{font-size:32px;letter-spacing:-.5px}h2{font-size:22px}.mut{color:var(--tx2);font-size:13px}.big{font-size:32px;font-weight:800}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--in2)}.b-ok{color:var(--ok)}.b-wa{color:var(--wa)}.b-er{color:var(--er)}.b-in{color:var(--in)}
.logo{font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:8px}.logo i{width:22px;height:22px;border-radius:6px;background:var(--ac);display:inline-block;position:relative}.logo i:after{content:"";position:absolute;inset:5px 4px;border-top:3px solid #fff;border-bottom:3px solid #fff}
/* landing */
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 5%;max-width:1200px;margin:auto}.top nav{display:flex;gap:22px}.top nav a{text-decoration:none;color:var(--tx2)}
.hero{max-width:1200px;margin:auto;padding:40px 5% 60px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}.hero h1{font-size:52px;line-height:1.05}.hero p{color:var(--tx2);margin:16px 0 24px;font-size:17px}
.prev{background:var(--nav);border-radius:18px;padding:16px;color:#fff;animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.prev .row{background:#111827;border-radius:10px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;font-size:13px}
.sec{max-width:1200px;margin:auto;padding:30px 5%}.faq summary{cursor:pointer;font-weight:600;padding:10px 0}
/* login */
.lg{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.lgl{background:var(--nav);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}.lgr{display:grid;place-items:center;padding:24px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--in2);border-radius:10px;padding:4px}.seg button{border:0;background:none;padding:8px;border-radius:8px;font-weight:700;cursor:pointer}.seg .on{background:var(--card);box-shadow:0 1px 3px #0002}
.err{background:#EF44441a;color:var(--er);padding:9px 12px;border-radius:8px;font-size:13px;margin-top:12px}
/* shell */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:var(--nav);color:#cbd5e1;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.side .logo{color:#fff;padding:0 10px 18px}
.side button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px}.side button:hover{background:#ffffff14}.side .on{background:var(--ac);color:#fff}
.main{padding:24px;min-width:0}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap}.bar>div{display:flex;gap:8px;align-items:center}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--tx2);font-size:12px;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--bd)}td{padding:11px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}tr:hover td{background:var(--in2)}
.bn{display:none}.tl{display:flex;gap:4px;margin-top:10px}.tl span{flex:1;height:5px;border-radius:9px;background:var(--bd)}.tl .d{background:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal div{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;font-size:13px;font-weight:600}
.ov{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:9;animation:fi .15s}@keyframes fi{from{opacity:0}}.ov .card{width:min(440px,100%);max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:80px;right:20px;background:var(--nav);color:#fff;padding:12px 18px;border-radius:10px;z-index:99;animation:fi .2s}
.sk{height:80px;border-radius:14px;background:linear-gradient(90deg,var(--in2),var(--bd),var(--in2));background-size:200%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200%}}
@media(max-width:800px){.hero,.lg{grid-template-columns:1fr}.lgl{display:none}.hero h1{font-size:36px}.top nav{display:none}
.shell{grid-template-columns:1fr}.side{display:none}.st .bn{display:flex}.main{padding:16px 16px 84px}
.bn{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}.bn button{background:none;border:0;font-size:11px;padding:6px 10px;color:var(--tx2)}.bn .on{color:var(--ac);font-weight:700}
.sf .side{display:block;position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:8px}.sf .side .logo{display:none}.sf .side button{white-space:nowrap;width:auto}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const USERS={"johnwick@bunkr.edu":{p:"student123",role:"student",name:"John Wick",id:"STU001"},"warden@bunkr.edu":{p:"warden123",role:"warden",name:"Meera Iyer",id:"STF014"},"admin@bunkr.edu":{p:"admin123",role:"admin",name:"R. Kumar",id:"STF001"}};
const D={
students:[["STU001","John Wick","CSE",2,"B-204",92,"Active"],["STU002","Rahul M","ECE",3,"B-204",88,"Active"],["STU003","Arun P","MECH",1,"B-204",76,"Active"],["STU004","Karthik S","CSE",4,"B-204",95,"Leave"],["STU005","Divya R","IT",2,"A-102",81,"Active"],["STU006","Naveen V","EEE",3,"B-202",64,"Suspended"],["STU007","Priya L","CSE",1,"B-201",97,"Active"],["STU008","Vignesh T","CIVIL",2,"A-102",90,"Active"],["STU009","Ananya S","IT",3,"A-101",93,"Active"],["STU010","Harish B","MECH",2,"A-101",71,"Active"],["STU011","Meenakshi K","ECE",1,"C-102",89,"Active"],["STU012","Surya N","CSE",3,"C-102",84,"Active"],["STU013","Dinesh R","EEE",4,"C-103",78,"Active"],["STU014","Lakshmi P","IT",2,"C-103",96,"Active"],["STU015","Gokul M","CIVIL",1,"B-201",68,"Active"],["STU016","Aravind J","CSE",2,"B-202",91,"Active"],["STU017","Sanjay D","MECH",3,"B-202",73,"Leave"],["STU018","Pooja V","ECE",4,"A-102",99,"Active"],["STU019","Manoj K","EEE",1,"C-104",82,"Active"],["STU020","Bharath S","IT",3,"C-104",87,"Active"],["STU021","Keerthana A","CSE",1,"A-103",94,"Active"],["STU022","Yuvan T","CIVIL",4,"A-103",60,"Suspended"],["STU023","Nithya G","ECE",2,"B-201",85,"Active"],["STU024","Prakash L","MECH",1,"A-101",79,"Active"]],
reqs:[["REQ-10482","STU001","B-204","Electrical","High","Assigned"],["REQ-10483","STU003","A-101","Plumbing","Medium","In Progress"],["REQ-10484","STU005","A-102","Internet","Low","Submitted"]],
leaves:[["LV-771","STU002","Family function","12 Oct","14 Oct","Pending"],["LV-772","STU007","Medical","10 Oct","11 Oct","Pending"]],
notes:[["Your laundry is ready for pickup.",0],["Maintenance request REQ-10482 was assigned.",0],["Hostel inspection scheduled tomorrow.",1],["New announcement from your warden.",1]],
laundry:{id:"LND-3042",items:14,st:3}};
const ST=["Submitted","Assigned","In Progress","Resolved","Closed"],LS=["Requested","Collected","Washing","Ready","Delivered"];
let S={page:"landing",user:null,role:"student",err:"",busy:false,fq:"",fd:"",sub:"home",theme:load("bt")||"system"};
function load(k){try{return localStorage.getItem(k)}catch(e){}}function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function applyTheme(){const d=S.theme==="dark"||(S.theme==="system"&&matchMedia("(prefers-color-scheme:dark)").matches);document.documentElement.dataset.t=d?"dark":"light"}
function toast(m){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2400)}
const bd=(t,c)=>`<span class="badge ${c||""}">${t}</span>`;
const sc=s=>({Active:"b-ok",Resolved:"b-ok",Approved:"b-ok",Closed:"b-ok",Pending:"b-wa",Leave:"b-wa","In Progress":"b-wa",Medium:"b-wa",Suspended:"b-er",High:"b-er",Rejected:"b-er",Assigned:"b-in",Submitted:"b-in"}[s]||"");
const NAV={student:[["home","🏠 Dashboard"],["room","🛏 My Room"],["att","📅 Attendance"],["laundry","🧺 Laundry"],["reqs","🛠 Requests"],["comp","💬 Complaints"],["ann","📢 Announcements"],["food","🍽 Food Token"],["visit","👥 Visitors"],["vacate","🚪 Vacate"],["notif","🔔 Notifications"],["profile","👤 Profile & Settings"]],
staff:[["home","📊 Dashboard"],["studs","🎓 Students"],["reqs","🛠 Requests"],["leaves","📝 Leave Requests"],["comp","💬 Complaints"],["ann","📢 Announcements"],["attm","✅ Attendance"],["bio","🖐 Biometric Log"],["meal","📅 Meal Planner"],["gate","🚧 Gate Pass"],["foods","🍽 Food Mgmt"],["visit","👥 Visitors"],["vacate","🚪 Vacate Clearance"],["reports","📄 Reports"],["laundry","🧺 Laundry"],["admin","🔐 Admin & Audit"],["profile","👤 Profile & Settings"]]};
const STAFFONLY=["studs","leaves","admin","attm","foods","reports","meal","gate","bio"];
function view(){
 if(S.page==="landing")return landing();if(S.page==="login")return login();
 const u=S.user,stu=u.role==="student",nav=NAV[stu?"student":"staff"];
 const pages={home:stu?stHome:sfHome,room,att,laundry,reqs,notif,studs,leaves,admin,food,foods,visit,vacate,attm,reports,comp,ann,meal,gate,bio,profile};
 const denied=(!stu&&!nav.some(n=>n[0]===S.sub))||(stu&&STAFFONLY.includes(S.sub))||(S.sub==="admin"&&u.role!=="admin");
 const body=S.load?`<div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>`:!pages[S.sub]?`<div class="card" style="text-align:center;padding:60px"><h1>404</h1><p class="mut">This room doesn't exist.</p><button class="btn pri" data-go="home">Go home</button></div>`:denied?`<div class="card" style="text-align:center;padding:60px"><h1>403</h1><p class="mut">Looks like this door is locked. You're not authorized to enter this area.</p></div>`:pages[S.sub]();
 return `<div class="shell ${stu?"st":"sf"}"><aside class="side"><div class="logo"><i></i>BUNKR</div>${nav.map(n=>`<button data-go="${n[0]}" class="${S.sub===n[0]?"on":""}">${n[1]}</button>`).join("")}<button data-act="theme">🌓 Theme: ${S.theme}</button><button data-act="out">↩ Sign out</button></aside>
 <main class="main"><div class="bar"><div><span class="badge">${u.role.toUpperCase()}</span></div><div>${stu?"":`<select id="cp" aria-label="Campus" style="width:auto"><option ${S.cp!=="Rathinam Tech"&&S.cp!=="Rathinam Arts"?"selected":""}>All campuses<option ${S.cp==="Rathinam Tech"?"selected":""}>Rathinam Tech<option ${S.cp==="Rathinam Arts"?"selected":""}>Rathinam Arts</select><input id="gs" placeholder="Search ( / )" style="width:220px" aria-label="Search">`}<button class="btn sm" data-go="notif" aria-label="Notifications">🔔 ${D.notes.filter(n=>!n[1]).length}</button><button class="btn sm" data-act="theme">🌓</button><button class="btn sm" data-act="out">Out</button></div></div>${body}</main>
 ${stu?`<nav class="bn">${[["home","🏠","Home"],["reqs","🛠","Requests"],["laundry","🧺","Laundry"],["notif","🔔","Alerts"],["room","👤","Room"]].map(n=>`<button data-go="${n[0]}" class="${S.sub===n[0]?"on":""}">${n[1]}<br>${n[2]}</button>`).join("")}</nav>`:""}</div>`}
function landing(){return `<header class="top"><div class="logo"><i></i>BUNKR</div><nav><a href="#f">Features</a><a href="#f">For Students</a><a href="#f">For Staff</a><a href="#q">FAQ</a></nav><div><button class="btn" data-act="login">Login</button> <button class="btn pri" data-act="login">Get Started</button></div></header>
<section class="hero"><div><span class="badge b-in">Campus living, simplified.</span><h1 style="margin-top:14px">Hostel life, without the chaos.</h1><p>Bunkr brings rooms, requests, attendance, laundry, support and hostel communication into one simple platform.</p><button class="btn pri" data-act="login">Get Started</button> <a class="btn" href="#f" style="text-decoration:none;display:inline-block">Explore Bunkr</a></div>
<div class="prev"><b>Good morning, John 👋</b><div class="row"><span>Room B-204</span><span style="color:#FF6B35">Bed B2</span></div><div class="row"><span>Attendance</span><b>92%</b></div><div class="row"><span>Laundry</span><span>Ready for pickup</span></div><div class="row"><span>REQ-10482</span><span>Assigned</span></div></div></section>
<section class="sec" id="f"><h2>Everything a hostel runs on</h2><div class="grid g3" style="margin-top:16px">${[["🛠 Service requests","Ticket IDs and live status timelines."],["📅 Attendance","Calendar view, bulk marking for wardens."],["🧺 Laundry","Track every load from pickup to delivery."],["📝 Leave approvals","Approve in one click, status updates itself."],["📊 Analytics","Occupancy, requests and trends at a glance."],["🔐 Role-based access","Students never see staff tools."]].map(f=>`<div class="card"><b>${f[0]}</b><p class="mut">${f[1]}</p></div>`).join("")}</div></section>
<section class="sec faq" id="q"><h2>FAQ</h2><details><summary>Who can sign in?</summary><p class="mut">Students, wardens, managers, admins and support staff — each gets their own experience.</p></details><details><summary>How do I get an account?</summary><p class="mut">Contact hostel administration.</p></details></section><footer class="sec mut">© 2026 Bunkr · Your hostel. One smarter space.</footer>`}
function login(){const st=S.role==="student";return `<div class="lg"><div class="lgl"><div class="logo"><i></i>BUNKR</div><div><h1>Your hostel.<br>One smarter space.</h1></div><span class="mut">Demo: johnwick@bunkr.edu / student123 · warden@bunkr.edu / warden123 · admin@bunkr.edu / admin123</span></div>
<div class="lgr"><div class="card" style="width:min(400px,100%)"><div class="logo" style="margin-bottom:14px"><i></i>BUNKR</div><div class="seg" role="tablist"><button class="${st?"on":""}" data-role="student">Student</button><button class="${st?"":"on"}" data-role="staff">Staff</button></div>
<label for="em">${st?"Email / Student ID":"Staff ID / Email"}</label><input id="em" value="${st?"johnwick@bunkr.edu":"warden@bunkr.edu"}" autocomplete="username"><label for="pw">Password</label><div style="display:flex;gap:6px"><input id="pw" type="password" autocomplete="current-password"><button class="btn" data-act="eye" aria-label="Toggle password">👁</button></div>
${S.err?`<div class="err" role="alert">${S.err}</div>`:""}<button class="btn pri" style="width:100%;margin-top:16px" data-act="signin" ${S.busy?"disabled":""}>${S.busy?"Signing in…":`Sign in as ${st?"Student":"Staff"}`}</button><p class="mut" style="margin-top:12px"><a href="#" data-act="forgot">Forgot password?</a> · Contact hostel administration</p><p class="mut"><a href="#" data-act="home">← Back</a></p></div></div></div>`}
function stHome(){const p=D.reqs.filter(r=>r[1]==="STU001").length;return `<h1>Good morning, ${S.user.name} 👋</h1><p class="mut">Room B-204 · Block B · Bed B2</p><div class="grid g3" style="margin:20px 0"><div class="card"><span class="mut">Attendance</span><div class="big">92%</div><span class="mut">3 days present this week</span></div><div class="card"><span class="mut">Pending requests</span><div class="big">${p+1}</div></div><div class="card"><span class="mut">Laundry</span><div class="big" style="font-size:20px">${LS[D.laundry.st]}</div><span class="mut">Ready for pickup</span></div></div>
<div class="card"><b>Quick actions</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn pri" data-act="newreq">+ Request service</button><button class="btn" data-go="laundry">Laundry</button><button class="btn" data-act="newreq">Complaint</button><button class="btn" data-act="leave">Leave request</button></div></div>
<div class="card" style="margin-top:16px"><b>Announcements</b><p class="mut" style="margin-top:8px">• Hostel inspection tomorrow 10 AM<br>• Mess menu updated for festival week</p></div>`}
function room(){return `<h1>Room B-204</h1><div class="grid g2" style="margin-top:16px"><div class="card"><p class="mut">Block B · Floor 2 · 4 beds</p><div class="big">Bed B2</div><b style="display:block;margin-top:12px">Roommates</b>${["Rahul","Arun","Karthik"].map(n=>`<div style="padding:6px 0">${n}</div>`).join("")}</div><div class="card"><b>Report a room issue</b><p class="mut">Broken fan, leaking tap, anything else.</p><button class="btn pri" style="margin-top:10px" data-act="newreq">Report issue</button> <button class="btn sm" data-qr="ID-${S.user.id}">Identity QR</button></div></div>`}
function att(){const c=[];for(let d=1;d<=30;d++){const w=(d+2)%7,s=w===0?["Holiday","#9CA3AF"]:d===9||d===17?["Absent","#EF4444"]:d===22?["Leave","#F59E0B"]:["Present","#16A34A"];c.push(`<div style="background:${s[1]}22;color:${s[1]}" title="${s[0]}" aria-label="Day ${d} ${s[0]}">${d}${s[0][0]}</div>`)}return `<h1>Attendance</h1><div class="grid g2" style="margin-top:16px"><div class="card"><div class="cal">${c.join("")}</div><p class="mut" style="margin-top:12px">P Present · A Absent · L Leave · H Holiday</p></div><div class="card"><span class="mut">August</span><div class="big">92%</div><span class="mut">September</span><div class="big">95%</div></div></div>`}
function laundry(){const l=D.laundry,sf=S.user.role!=="student";return `<h1>Laundry</h1><div class="card" style="margin-top:16px"><b>${l.id}</b> · ${l.items} items ${bd(LS[l.st],sc("Active"))}<div class="tl">${LS.map((_,i)=>`<span class="${i<=l.st?"d":""}"></span>`).join("")}</div><p class="mut" style="margin-top:8px">${LS.join(" → ")}</p><button class="btn sm" data-qr="${l.id}">Show QR</button> ${sf&&l.st<4?`<button class="btn pri sm" style="margin-top:10px" data-act="lnext">Advance status</button>`:""}${!sf&&l.st===0?`<button class="btn sm" data-act="lcancel">Cancel</button>`:""}</div>`}
function reqs(){const sf=S.user.role!=="student",rows=D.reqs.filter(r=>sf||r[1]==="STU001");return `<div class="bar"><h1>Requests</h1>${sf?"":`<button class="btn pri" data-act="newreq">+ New request</button>`}</div>${rows.length?`<div class="card tw"><table><tr><th>ID<th>Room<th>Category<th>Priority<th>Status<th>Progress${sf?"<th>":""}</tr>${rows.map(r=>{const i=ST.indexOf(r[5]);return `<tr><td>${r[0]}<td>${r[2]}<td>${r[3]}<td>${bd(r[4],sc(r[4]))}<td>${bd(r[5],sc(r[5]))}<td><div class="tl" style="width:120px">${ST.map((_,k)=>`<span class="${k<=i?"d":""}"></span>`).join("")}</div>${sf?`<td><button class="btn sm" data-adv="${r[0]}">Advance</button>`:""}</tr>`}).join("")}</table></div>`:`<div class="card" style="text-align:center;padding:40px">No requests yet.<br><button class="btn pri" style="margin-top:10px" data-act="newreq">Create one</button></div>`}`}
function notif(){return `<div class="bar"><h1>Notifications</h1><button class="btn sm" data-act="readall">Mark all as read</button></div><div class="card">${D.notes.map(n=>`<div style="padding:12px 0;border-bottom:1px solid var(--bd);${n[1]?"opacity:.6":""}">${n[1]?"":"● "}${n[0]}</div>`).join("")}</div>`}
function sfHome(){const v=[["Students","1,248"],["Occupancy","94.2%"],["Pending requests",D.reqs.filter(r=>r[5]!=="Resolved").length+34],["Open complaints","12"]];const pts=[82,85,84,88,90,89,92];const mx=100;const path=pts.map((y,i)=>`${i*60+20},${120-(y-70)*3.4}`).join(" ");

function meal(){return `<div class="bar"><h1>Meal planner</h1><button class="btn pri" data-y="msave">Save menu</button></div><div class="card tw"><table><tr><th>Day<th>Breakfast<th>Lunch<th>Snacks<th>Dinner</tr>${Object.entries(D.plan).map(([d,m])=>`<tr><td><b>${d}</b>${m.map((x,i)=>`<td><input class="mp" data-d="${d}" data-i="${i}" value="${x}" aria-label="${d} ${MEALS[i][0]}">`).join("")}</tr>`).join("")}</table></div>`}
function gate(){return `<h1 style="margin-bottom:16px">Gate pass log</h1><div class="card tw"><table><tr><th>ID<th>Student<th>Reason<th>Status<th>Time<th></tr>${D.gates.map((g,i)=>`<tr><td>${g[0]}<td>${g[1]}<td>${g[4]}<td>${bd(g[2],g[2]==="In"?"b-ok":"b-wa")}<td>${g[3]}<td><button class="btn sm" data-y="gt" data-i="${i}">Mark ${g[2]==="In"?"out":"in"}</button></tr>`).join("")}</table></div>`}
document.addEventListener("click",e=>{const t=e.target.closest("[data-y]");if(!t)return;const d=t.dataset,y=d.y,c=D.comps.find(x=>x[0]===d.id),tm=()=>new Date().toTimeString().slice(0,5);
 if(y==="cas"){c[4]="Assigned";c[5]=S.user.name;toast(c[0]+" assigned");return render()}
 if(y==="cres"){c[4]="Resolved";D.notes.unshift([c[0]+" was resolved.",0]);AUD.unshift([S.user.name,"Resolved "+c[0],"now"]);toast("Resolved");return render()}
 if(y==="cesc"){c[3]="Critical";toast("Escalated");return render()}
 if(y==="creo"){c[4]="Open";c[5]="";c[6]=0;toast("Complaint reopened");return render()}
 if(y==="crate"){const o=modal(`<h2>Rate the resolution</h2><label for="cr">Stars</label><select id="cr">${[5,4,3,2,1].map(n=>`<option>${n}`).join("")}</select><br><br><button class="btn pri" id="ck">Submit</button>`);o.querySelector("#ck").onclick=()=>{c[6]=+o.querySelector("#cr").value;o.remove();toast("Thanks for rating");render()};return}
 if(y==="cnew"){const o=modal(`<h2>Raise complaint</h2><label for="cd">Describe the issue</label><textarea id="cd" rows="3"></textarea><label for="cp2">Priority</label><select id="cp2"><option>Low<option>Medium<option>High</select><br><br><button class="btn pri" id="cs">Submit</button>`);o.querySelector("#cs").onclick=()=>{const v=o.querySelector("#cd").value.trim();if(!v)return;const id="CMP-"+(2304+D.comps.length-3);D.comps.unshift([id,"STU001",v,o.querySelector("#cp2").value,"Open","",0]);o.remove();toast("Complaint "+id+" raised");render()};return}
 if(y==="apub"){const ti=$("#at").value.trim();if(!ti)return toast("Add a title");D.anns.unshift([ti,$("#ad").value.trim(),$("#au").value,$("#ap").value,"Just now"]);D.notes.unshift(["New announcement: "+ti,0]);AUD.unshift([S.user.name,"Published announcement "+ti,"now"]);toast("Published — students notified");return render()}
 if(y==="msave"){document.querySelectorAll(".mp").forEach(i=>D.plan[i.dataset.d][+i.dataset.i]=i.value);return toast("Menu saved")}
 if(y==="gt"){const g=D.gates[d.i];g[2]=g[2]==="In"?"Out":"In";g[3]=tm();toast(g[1]+" marked "+g[2].toLowerCase());return render()}
});
const camp=s=>!S.cp||S.cp==="All campuses"||((+s[0].slice(3))%2?"Rathinam Tech":"Rathinam Arts")===S.cp;
function bldRows(){const g={};D.students.filter(camp).forEach(s=>{const b="Block "+s[4][0];(g[b]=g[b]||{n:0,a:0,r:new Set()});g[b].n++;g[b].a+=s[5];g[b].r.add(s[4])});return Object.entries(g).map(([b,v])=>[b,v.n,(v.a/v.n).toFixed(1),v.r.size])}
D.prof={phone:"98765 43210",emg:"+91 90000 11122"};
function bio(){return `<h1 style="margin-bottom:16px">Biometric log</h1><div class="card tw"><table><tr><th>ID<th>Name<th>Check-in<th>Check-out<th>Device<th>Result</tr>${D.students.filter(camp).map((s,i)=>{const a=s[6]==="Active"&&i%7!==3;return `<tr><td>${s[0]}<td>${s[1]}<td>${a?"0"+(6+i%3)+":"+String(10+i*7%50).padStart(2,"0"):"–"}<td>${a&&i%2?"18:"+String(10+i*3%50):"–"}<td>${s[4][0]}-Gate ${1+i%2}<td>${bd(a?"Verified":"No scan",a?"b-ok":"b-er")}</tr>`}).join("")}</table></div>`}
function profile(){const u=S.user,st=u.role==="student";return `<h1>Profile & settings</h1><div class="grid g2" style="margin-top:16px"><div class="card"><div style="display:flex;gap:12px;align-items:center"><div class="badge" style="width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--soft);color:var(--ac)">${u.name.split(" ").map(w=>w[0]).join("")}</div><div><b>${u.name}</b><br><span class="mut">${u.id} · ${st?"Student":u.role}</span></div></div>
${st?`<p class="mut" style="margin-top:12px">CSE · Year 2 · Block B · Room B-204</p><label for="pp">Phone (editable)</label><input id="pp" value="${D.prof.phone}"><label for="pe">Emergency contact (editable)</label><input id="pe" value="${D.prof.emg}"><br><br><button class="btn pri" data-z="psave">Save changes</button>`:`<p class="mut" style="margin-top:12px">Hostel: Kings 1 · Joined 14 Jun 2022</p><b style="display:block;margin-top:12px">Recent activity</b>${AUD.slice(0,5).map(a=>`<p class="mut" style="padding:4px 0">${a[1]} · ${a[2]}</p>`).join("")}`}</div>
<div class="card"><b>Appearance</b><label for="thm">Theme</label><select id="thm">${["system","light","dark"].map(t=>`<option ${S.theme===t?"selected":""}>${t}`).join("")}</select><p class="mut" style="margin-top:8px">Saved on this device.</p></div></div>`}
document.addEventListener("click",e=>{const t=e.target.closest("[data-z]");if(t&&t.dataset.z==="psave"){const p=$("#pp").value.trim(),m=$("#pe").value.trim();if(!p||!m)return toast("Fields can't be empty");D.prof.phone=p;D.prof.emg=m;toast("Profile updated")}});
document.addEventListener("change",e=>{if(e.target.id==="cp"){S.cp=e.target.value;render()}if(e.target.id==="thm"){S.theme=e.target.value;save("bt",S.theme);render()}});
render();
</script></body></html>
